<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduNexus 模式体验</title>
    <link rel="stylesheet" href="assets/edunexus-ui.css" />
    <style>
      html, body, [data-demo-workspace] { width:100%; height:100%; min-height:0; margin:0; overflow:hidden; background:#fff; }
      body { color-scheme:light; }
      .demo-production-root { font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif); font-size: 12px; }
      .demo-production-feed > div { min-height:100%; }
      .demo-production-feed .beautiful-ui-surface { width:100%; max-width: none; }
      .demo-production-root .board-sidebar { width: 216px !important; }
      /* 演示页只开放模式切换；输入框、语音和发送按钮保留真实外观但不触发操作。 */
      .demo-production-root textarea[aria-label='消息'] { pointer-events:none; user-select:none; caret-color:transparent; }
      .demo-production-root button[aria-label='发送消息'], .demo-production-root button[aria-label='语音输入'] { pointer-events:none; opacity:.78; }
      @media (max-width: 760px) { .demo-production-root { padding:6px !important; gap:6px !important; } .demo-production-root .board-sidebar { width: 150px !important; } }
      @media (max-width: 560px) { .demo-production-root .board-sidebar { display:none !important; } }
    </style>
  </head>
  <body>
    <div data-demo-workspace aria-label="EduNexus 真实前端模式体验"></div>
    <script>window.__EDUNEXUS_VERSION__ = 'homepage-demo-showcase';</script>
    <script type="module" src="assets/demo-workspace-demo.js"></script>
  </body>
</html>
